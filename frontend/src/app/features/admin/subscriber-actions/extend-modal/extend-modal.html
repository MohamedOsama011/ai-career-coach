@if (open()) {
  <div class="modal-backdrop" (click)="handleBackdropClick($event)" (keydown)="handleKeydown($event)">
    <div class="modal" role="alertdialog" aria-modal="true" aria-labelledby="extend-modal-title">
      <div class="modal-header">
        <span class="material-icons">date_range</span>
        <h2 id="extend-modal-title">Extend Subscription</h2>
      </div>

      <div class="modal-body">
        <div class="form-group">
          <label for="extend-days">Additional Days</label>
          <input
            id="extend-days"
            type="number"
            min="1"
            max="3650"
            [ngModel]="additionalDays()"
            (ngModelChange)="additionalDays.set($event)"
            [disabled]="loading()"
            (keydown)="handleKeydown($event)">
          @if (additionalDays() < 1) {
            <span class="field-error">Must be at least 1 day</span>
          }
        </div>

        <div class="form-group">
          <label for="extend-notes">Notes (optional)</label>
          <textarea
            id="extend-notes"
            placeholder="Reason for extension..."
            rows="3"
            [ngModel]="notes()"
            (ngModelChange)="notes.set($event)"
            [disabled]="loading()">
          </textarea>
        </div>

        <div class="preview">
          Ending in <strong>{{ additionalDays() }} days</strong>
          @if (additionalDays() > 0) {
            <span>· New end date: <strong>{{ getNewEndDate() }}</strong></span>
          }
        </div>
      </div>

      <div class="modal-footer">
        <button class="btn btn-secondary" (click)="cancel.emit()" [disabled]="loading()">Cancel</button>
        <button class="btn btn-primary" (click)="handleConfirm()" [disabled]="loading() || additionalDays() < 1">
          @if (loading()) {
            <span class="spinner-sm"></span>
            <span>Extending...</span>
          } @else {
            <span>Extend</span>
          }
        </button>
      </div>
    </div>
  </div>
}
