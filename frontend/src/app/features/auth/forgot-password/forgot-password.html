<!-- ==========================================
     FORGOT PASSWORD — rendered inside auth-right panel
     ========================================== -->
<div class="auth-form auth-form-animate">
    <div class="auth-form-header">
        <h1 class="auth-form-title">Forgot password?</h1>
        <p class="auth-form-subtitle">Enter your email and we'll send you a reset link</p>
    </div>

    @if (errorMessage()) {
        <div class="error-message auth-form-animate">{{ errorMessage() }}</div>
    }

    @if (successMessage()) {
        <div class="success-message auth-form-animate">
            <span class="material-symbols-rounded success-icon">mark_email_read</span>
            {{ successMessage() }}
        </div>
    }

    @if (!successMessage()) {
        <form (ngSubmit)="onSubmit()" #forgotForm="ngForm">
            <div class="form-group auth-form-animate" [class.field-error]="emailTouched && !email">
                <label for="email">Email</label>
                <div class="input-wrapper">
                    <span class="material-symbols-rounded input-icon">mail</span>
                    <input type="email" id="email" [(ngModel)]="email" name="email" (blur)="emailTouched = true" placeholder="you@example.com" required>
                </div>
                @if (emailTouched && !email) {
                    <span class="field-error-msg">Email is required</span>
                }
            </div>

            <button type="submit" class="submit-btn auth-form-animate" [disabled]="isLoading()">
                @if (isLoading()) {
                    <span class="spinner"></span>
                    Sending...
                } @else {
                    Send Reset Link
                }
            </button>
        </form>
    }

    <p class="auth-switch auth-form-animate">
        <a routerLink="/login" class="back-link">
            <span class="material-symbols-rounded back-icon">arrow_back</span>
            Back to Sign In
        </a>
    </p>
</div>
