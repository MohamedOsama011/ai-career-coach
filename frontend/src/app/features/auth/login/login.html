<!-- ==========================================
     LOGIN FORM — rendered inside auth-right panel
     ========================================== -->
<div class="auth-form auth-form-animate">
    <div class="auth-form-header">
        <h1 class="auth-form-title">Welcome back</h1>
        <p class="auth-form-subtitle">Sign in to your account</p>
    </div>

    @if (errorMessage()) {
        <div class="error-message auth-form-animate">{{ errorMessage() }}</div>
    }

    <form (ngSubmit)="onSubmit()" #loginForm="ngForm">
        <div class="form-group auth-form-animate" [class.field-error]="emailTouched && !email">
            <label for="email">Email</label>
            <div class="input-wrapper">
                <span class="material-symbols-rounded input-icon">mail</span>
                <input type="email" id="email" [(ngModel)]="email" name="email" (blur)="emailTouched = true" placeholder="you@example.com" required>
            </div>
            @if (emailTouched && !email) {
                <span class="field-error-msg">Email is required</span>
            }
        </div>

        <div class="form-group auth-form-animate" [class.field-error]="passwordTouched && !password">
            <label for="password">Password</label>
            <div class="input-wrapper">
                <span class="material-symbols-rounded input-icon">lock</span>
                <input [type]="showPassword ? 'text' : 'password'" id="password" [(ngModel)]="password" name="password" (blur)="passwordTouched = true" placeholder="Enter your password" required>
                <button type="button" class="password-toggle" (click)="showPassword = !showPassword" [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'" tabindex="-1">
                    <span class="material-symbols-rounded">{{ showPassword ? 'visibility_off' : 'visibility' }}</span>
                </button>
            </div>
            @if (passwordTouched && !password) {
                <span class="field-error-msg">Password is required</span>
            }
        </div>

        <div class="form-options auth-form-animate">
            <label class="checkbox-label">
                <input type="checkbox" [(ngModel)]="rememberMe" name="rememberMe">
                <span>Remember me</span>
            </label>
            <a routerLink="/forgot-password" class="forgot-link">Forgot password?</a>
        </div>

        <button type="submit" class="submit-btn auth-form-animate" [disabled]="isLoading()">
            @if (isLoading()) {
                <span class="spinner"></span>
                Signing in...
            } @else {
                Sign In
            }
        </button>
    </form>

    <div class="social-divider auth-form-animate">
        <span class="social-divider-line"></span>
        <span class="social-divider-text">or continue with</span>
        <span class="social-divider-line"></span>
    </div>

    <div class="social-buttons auth-form-animate">
        <button type="button" class="google-custom-btn" (click)="onGoogleClick()">
            <svg class="google-icon" viewBox="0 0 24 24" width="20" height="20">
                <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/>
                <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
            </svg>
            <span>Continue with Google</span>
        </button>
    </div>

    <p class="auth-switch auth-form-animate">Don't have an account? <a routerLink="/register">Create one</a></p>
</div>
