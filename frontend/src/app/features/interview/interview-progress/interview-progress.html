<div class="step-indicator">
  <div class="step-dots" role="list" aria-label="Interview progress">
    @for (step of stepArray(); track step) {
      <div class="step-dot-wrapper">
        <div class="step-dot"
             [class]="stepClass(step)"
             [attr.aria-current]="step === current() ? 'step' : null"
             [attr.aria-label]="'Question ' + step + ' of ' + max() + ', ' + stepClass(step)">
        </div>
        @if (step < max()) {
          <div class="step-line" [class.completed]="step < current()"></div>
        }
      </div>
    }
  </div>
