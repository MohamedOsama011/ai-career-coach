
<div class="container">

    <h2>Create Subscription</h2>

    <div class="form">

        <label>Name</label>

        <input
            type="text"
            [(ngModel)]="plans.name">

        <label>Price</label>

        <input
            type="number"
            [(ngModel)]="plans.price">

            <label>Description</label>

        <input
            type="text"
            [(ngModel)]="plans.description">


        <div class="buttons">

            <button
                class="create-btn"
                (click)="create()">

                Create

            </button>

            <button
                class="cancel-btn"
                (click)="cancel()">

                Cancel

            </button>

        </div>

    </div>

</div>
