<div class="container">
    <h2>Update Subscription</h2>
    @if (loading) {
        <p>Loading...</p>
    } @else {
        <div class="form">
            <label>Name</label>
            <input type="text" [(ngModel)]="plan.name">

            <label>Price</label>
            <input type="number"  [(ngModel)]="plan.price">

            <div class="buttons">
                <button class="update-btn"  (click)="update()">Update  </button>
                <button class="cancel-btn"(click)="cancel()">Cancel</button>
            </div>
        </div>

    }

</div>
