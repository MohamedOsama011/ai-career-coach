<div class="container">

    <h2>Subscription Details</h2>
 <p>Loading = {{ loading }}</p>
    <p>Name = {{ plan.name }}</p>
    <p>Price = {{ plan.price }}</p>

    @if(loading){
        <p>Loading...</p>
    }
    @else{
        <div class="card">
            <h3>{{plan.name}}</h3>
            <p><strong>Price :</strong>{{plan.price}}</p>
            <button class="back-btn"(click)="back()"> Back</button>
        </div>
    }
</div>
